rubrics:
  - id: 1
    type: f2p
    text: 现有各类探针都可从 YAML 接收逐探针 maintenance 区间；带时区绝对时间按左闭右开生效，重叠和首尾相接区间连续处理，非法或反向区间给出明确错误且不悄悄按普通探针运行。
  - id: 2
    type: f2p
    text: 维护内仍执行实际探测并更新原始结果、响应和耗时，但不推进确认服务状态、成功失败阈值、告警轮次或有效 SLA 统计；跨越维护边界才返回的探测始终按开始时刻归属。
  - id: 3
    type: f2p
    text: 维护结束后只用新的窗口外观测积累阈值，维护前正常而仅在维护内失败的服务不产生故障或恢复通知；维护前已故障的服务达到恢复阈值后只发一次恢复，持续时间正确扣除维护并集，未恢复时延续原告警进度。
  - id: 4
    type: f2p
    text: 分别阻塞通道消费和让通知第一次发送失败后跨入维护，旧状态事件均不得在维护内开始发送或再次重试，窗口结束后也不补发；一个已开始的发送可结束，未维护探针的投递与定期 SLA 报告不受影响。
  - id: 5
    type: f2p
    text: 分别在维护窗口内重启和停机跨过窗口结束后从 SLA 文件启动，维护前确认状态、未闭合故障及有效累计值均被保留，新观测继续正确判定且没有重复结算或停机样本补记。
  - id: 6
    type: f2p
    text: 分别读取 HTML、JSON、定期 SLA 格式化结果和 Prometheus，均能区分维护状态与最新原始观测、有效服务状态，报告可见维护原因，SLA 使用排除维护后的统计，指标有独立维护标识且既有名称与标签仍可用。
  - id: 7
    type: p2p
    text: 完全未配置维护的探针保留默认通道、success/failure 阈值、regular/increment/exponent 告警策略、重试和 SLA 统计行为；旧版 SLA 文件及 data 为减号的禁用持久化配置可继续正常使用。
